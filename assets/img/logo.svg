<?xml version="1.0" encoding="UTF-8"?>
<!-- Md Hasibul Hossain — primary logo.
     An H for Hossain; the three graded bands beneath the crossbar read as
     soil strata, referencing geotechnical and materials research.
     Vector: scales to any size without loss. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Md Hasibul Hossain">
  <defs>
    <linearGradient id="mhhGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16365c"/>
      <stop offset="1" stop-color="#15655a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#mhhGrad)"/>
  <g fill="#ffffff">
    <rect x="16.5" y="15" width="8" height="34" rx="1"/>
    <rect x="39.5" y="15" width="8" height="34" rx="1"/>
    <rect x="24.5" y="25.5" width="15" height="6.5"/>
  </g>
  <g fill="#ffffff">
    <rect x="24.5" y="35.5" width="15" height="2.4" opacity="0.62"/>
    <rect x="24.5" y="39.9" width="15" height="2.4" opacity="0.44"/>
    <rect x="24.5" y="44.3" width="15" height="2.4" opacity="0.26"/>
  </g>
</svg>
