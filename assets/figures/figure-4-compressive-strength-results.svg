      --fig-3: #b4802a;
      --fig-4: #9b4a2f;
      --fig-5: #5a6b86;
      --fig-grid: #e6e2da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fig-bg: #131f2b; --fig-panel: #192835; --fig-stroke: #46596b;
        --fig-ink: #dde6ee; --fig-ink-soft: #9aaab8;
        --fig-1: #7fb0e8; --fig-2: #4fc0aa; --fig-3: #e0a94f;
        --fig-4: #e08a6a; --fig-5: #93a6bd; --fig-grid: #24333f;
      }
    }
    svg { background: var(--fig-bg); }
  </style>

            <title id="fig4-title">Compressive strength against rice husk ash replacement level</title>
            <desc id="fig4-desc">Grouped bars showing average compressive strength
              in pounds per square inch at 7, 14 and 28 days for cement replacement
              levels of 0, 5, 10, 15, 20 and 25 per cent. At 28 days the control mix
              reached 2724 psi and the 5 per cent mix reached 3317 psi, a gain of
              21.8 per cent. Strength falls steeply beyond 10 per cent replacement,
              to 1535 psi at 15 per cent and 868 psi at 25 per cent.</desc>

            <text x="8" y="22" font-family="var(--font-body)" font-size="11.5"
                  font-weight="600" fill="var(--fig-ink)">Average compressive strength (psi)</text>

            <!-- legend -->
            <rect x="580" y="12" width="13" height="13" rx="2" fill="var(--fig-5)"/>
            <text x="600" y="23" font-family="var(--font-body)" font-size="10.5"
                  fill="var(--fig-ink-soft)">7 days</text>
            <rect x="660" y="12" width="13" height="13" rx="2" fill="var(--fig-1)"/>
            <text x="680" y="23" font-family="var(--font-body)" font-size="10.5"
                  fill="var(--fig-ink-soft)">14 days</text>
            <rect x="748" y="12" width="13" height="13" rx="2" fill="var(--fig-2)"/>
            <text x="768" y="23" font-family="var(--font-body)" font-size="10.5"
                  font-weight="650" fill="var(--fig-2)">28 days</text>

