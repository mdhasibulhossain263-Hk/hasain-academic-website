                <text x="460" y="60" text-anchor="middle" font-family="var(--font-display)"
                      font-size="13.5" font-weight="600" fill="var(--fig-ink)">Time-series &amp;</text>
                <text x="460" y="76" text-anchor="middle" font-family="var(--font-display)"
                      font-size="13.5" font-weight="600" fill="var(--fig-ink)">correlation analysis</text>
                <text x="460" y="96" text-anchor="middle" font-family="var(--font-body)"
                      font-size="10.5" fill="var(--fig-ink-soft)">Trend, seasonality and</text>
                <text x="460" y="109" text-anchor="middle" font-family="var(--font-body)"
                      font-size="10.5" fill="var(--fig-ink-soft)">inter-parameter structure</text>

                <rect x="565" y="32" width="160" height="86" rx="7"
                      fill="var(--fig-panel)" stroke="var(--fig-stroke)" stroke-width="1.3"/>
                <text x="645" y="60" text-anchor="middle" font-family="var(--font-display)"
                      font-size="13.5" font-weight="600" fill="var(--fig-ink)">Key pollution</text>
                <text x="645" y="76" text-anchor="middle" font-family="var(--font-display)"
                      font-size="13.5" font-weight="600" fill="var(--fig-ink)">parameters</text>
                <text x="645" y="96" text-anchor="middle" font-family="var(--font-body)"
                      font-size="10.5" fill="var(--fig-ink-soft)">Identified as governing</text>
                <text x="645" y="109" text-anchor="middle" font-family="var(--font-body)"
                      font-size="10.5" fill="var(--fig-ink-soft)">downstream quality</text>

                <rect x="750" y="32" width="160" height="86" rx="7"
                      fill="var(--fig-2)" opacity="0.1"/>
                <rect x="750" y="32" width="160" height="86" rx="7" fill="none"
                      stroke="var(--fig-2)" stroke-width="1.6"/>
                <text x="830" y="62" text-anchor="middle" font-family="var(--font-display)"
