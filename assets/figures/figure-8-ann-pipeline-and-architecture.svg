                <text x="830" y="78" text-anchor="middle" font-family="var(--font-display)"
                      font-size="13.5" font-weight="600" fill="var(--fig-2)">features</text>
                <text x="830" y="99" text-anchor="middle" font-family="var(--font-body)"
                      font-size="10.5" fill="var(--fig-ink-soft)">Feature set passed to</text>
                <text x="830" y="112" text-anchor="middle" font-family="var(--font-body)"
                      font-size="10.5" fill="var(--fig-ink-soft)">the network below</text>
              </g>

