  <style>
    /*  Standalone copy of a figure from mdhasibulhossain263-hk.github.io/hasain-academic-website
        Colours are defined here so the file works on its own in any
        viewer, and in Word, PowerPoint, Illustrator or Inkscape.       */
    :root {
      --font-display: Georgia, "Times New Roman", serif;
      --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: Menlo, Consolas, monospace;
      --fig-bg: #ffffff;
      --fig-panel: #f5f3ef;
      --fig-stroke: #b9b2a6;
      --fig-ink: #1b2a3a;
      --fig-ink-soft: #5c6b7a;
      --fig-1: #16365c;
      --fig-2: #1f7a6a;
      --fig-3: #b4802a;
      --fig-4: #9b4a2f;
      --fig-5: #5a6b86;
      --fig-grid: #e6e2da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fig-bg: #131f2b; --fig-panel: #192835; --fig-stroke: #46596b;
        --fig-ink: #dde6ee; --fig-ink-soft: #9aaab8;
        --fig-1: #7fb0e8; --fig-2: #4fc0aa; --fig-3: #e0a94f;
        --fig-4: #e08a6a; --fig-5: #93a6bd; --fig-grid: #24333f;
      }
    }
    svg { background: var(--fig-bg); }
  </style>

              <title id="fig8-title">Data pipeline and neural network architecture</title>
              <desc id="fig8-desc">Top: a five-stage data pipeline running from
                twenty years of surface water records held by government agencies,
                through compilation and quality control, time-series and correlation
                analysis, identification of the governing pollution parameters, and
                selection of model input features. Bottom: a feed-forward artificial
                neural network with an input layer, two hidden layers and a single
                forecast output.</desc>

              <defs>
                <marker id="arrowPipe" viewBox="0 0 10 10" refX="8.5" refY="5"
                        markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M0 0.8 L9 5 L0 9.2 z" fill="var(--fig-stroke)"/>
                </marker>
              </defs>

              <!-- ===== DATA PIPELINE ===== -->
              <text x="10" y="20" font-family="var(--font-body)" font-size="10"
                    font-weight="600" letter-spacing="0.1em" fill="var(--fig-ink-soft)">A   DATA PIPELINE</text>

              <g>
                <rect x="10" y="32" width="160" height="86" rx="7"
                      fill="var(--fig-1)" opacity="0.09"/>
                <rect x="10" y="32" width="160" height="86" rx="7" fill="none"
                      stroke="var(--fig-1)" stroke-width="1.6"/>
                <text x="90" y="58" text-anchor="middle" font-family="var(--font-display)"
                      font-size="19" font-weight="600" fill="var(--fig-1)">20 years</text>
                <text x="90" y="78" text-anchor="middle" font-family="var(--font-body)"
                      font-size="10.5" fill="var(--fig-ink-soft)">of surface-water</text>
                <text x="90" y="92" text-anchor="middle" font-family="var(--font-body)"
                      font-size="10.5" fill="var(--fig-ink-soft)">quality records, held</text>
                <text x="90" y="106" text-anchor="middle" font-family="var(--font-body)"
                      font-size="10.5" fill="var(--fig-ink-soft)">across agencies</text>

                <rect x="195" y="32" width="160" height="86" rx="7"
                      fill="var(--fig-panel)" stroke="var(--fig-stroke)" stroke-width="1.3"/>
                <text x="275" y="60" text-anchor="middle" font-family="var(--font-display)"
                      font-size="13.5" font-weight="600" fill="var(--fig-ink)">Compilation &amp;</text>
                <text x="275" y="76" text-anchor="middle" font-family="var(--font-display)"
                      font-size="13.5" font-weight="600" fill="var(--fig-ink)">quality control</text>
                <text x="275" y="96" text-anchor="middle" font-family="var(--font-body)"
                      font-size="10.5" fill="var(--fig-ink-soft)">Reconciling formats and</text>
                <text x="275" y="109" text-anchor="middle" font-family="var(--font-body)"
                      font-size="10.5" fill="var(--fig-ink-soft)">sampling regimes</text>

                <rect x="380" y="32" width="160" height="86" rx="7"
