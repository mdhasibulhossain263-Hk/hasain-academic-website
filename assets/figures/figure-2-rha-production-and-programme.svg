<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 300" role="img"
               aria-labelledby="fig2-title fig2-desc" xmlns="http://www.w3.org/2000/svg">
  <style>
    /*  Standalone copy of a figure from mdhasibulhossain263-hk.github.io/hasain-academic-website
        Colours are defined here so the file works on its own in any
        viewer, and in Word, PowerPoint, Illustrator or Inkscape.       */
    :root {
      --font-display: Georgia, "Times New Roman", serif;
      --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: Menlo, Consolas, monospace;
      --fig-bg: #ffffff;
      --fig-panel: #f5f3ef;
      --fig-stroke: #b9b2a6;
      --fig-ink: #1b2a3a;
      --fig-ink-soft: #5c6b7a;
      --fig-1: #16365c;
      --fig-2: #1f7a6a;
      --fig-3: #b4802a;
      --fig-4: #9b4a2f;
      --fig-5: #5a6b86;
      --fig-grid: #e6e2da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fig-bg: #131f2b; --fig-panel: #192835; --fig-stroke: #46596b;
        --fig-ink: #dde6ee; --fig-ink-soft: #9aaab8;
        --fig-1: #7fb0e8; --fig-2: #4fc0aa; --fig-3: #e0a94f;
        --fig-4: #e08a6a; --fig-5: #93a6bd; --fig-grid: #24333f;
      }
    }
    svg { background: var(--fig-bg); }
  </style>

            <title id="fig2-title">Ash production route and experimental programme</title>
            <desc id="fig2-desc">Rice husk collected from a mill in Bogra is burned
              at 250 to 300 degrees Celsius for two hours and ground to produce rice
              husk ash. Concrete is then batched at a 1 to 1.5 to 3 mix ratio with a
              water-cement ratio of 0.45, with cement replaced by ash at six levels
              from 0 to 25 per cent. Three cylindrical specimens per mix are cured
              and tested in compression at 7, 14 and 28 days.</desc>

            <defs>
              <marker id="arrowRha" viewBox="0 0 10 10" refX="8.5" refY="5"
                      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0 0.8 L9 5 L0 9.2 z" fill="var(--fig-stroke)"/>
              </marker>
            </defs>

            <text x="8" y="20" font-family="var(--font-body)" font-size="10"
                  font-weight="600" letter-spacing="0.1em"
                  fill="var(--fig-ink-soft)">A   ASH PREPARATION</text>

            <g>
              <rect x="8" y="32" width="196" height="84" rx="8"
                    fill="var(--fig-panel)" stroke="var(--fig-stroke)" stroke-width="1.3"/>
              <text x="24" y="58" font-family="var(--font-display)" font-size="14"
                    font-weight="600" fill="var(--fig-ink)">Rice husk</text>
              <text x="24" y="78" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">Collected from a rice mill</text>
              <text x="24" y="92" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">in Bogra. Agricultural</text>
              <text x="24" y="106" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">by-product.</text>

              <rect x="226" y="32" width="196" height="84" rx="8"
                    fill="var(--fig-panel)" stroke="var(--fig-stroke)" stroke-width="1.3"/>
              <text x="242" y="58" font-family="var(--font-display)" font-size="14"
                    font-weight="600" fill="var(--fig-ink)">Controlled burning</text>
              <text x="242" y="78" font-family="var(--font-body)" font-size="11"
                    font-weight="650" fill="var(--fig-3)">250–300 °C, 2 hours</text>
              <text x="242" y="94" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">Burning regime governs how</text>
              <text x="242" y="108" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">reactive the silica is.</text>

              <rect x="444" y="32" width="196" height="84" rx="8"
                    fill="var(--fig-panel)" stroke="var(--fig-stroke)" stroke-width="1.3"/>
              <text x="460" y="58" font-family="var(--font-display)" font-size="14"
                    font-weight="600" fill="var(--fig-ink)">Grinding</text>
              <text x="460" y="78" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">Ground in a mill to the</text>
              <text x="460" y="92" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">fineness required for</text>
              <text x="460" y="106" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">pozzolanic reaction.</text>

              <rect x="662" y="32" width="250" height="84" rx="8"
                    fill="var(--fig-2)" opacity="0.1"/>
              <rect x="662" y="32" width="250" height="84" rx="8" fill="none"
                    stroke="var(--fig-2)" stroke-width="1.7"/>
              <text x="678" y="56" font-family="var(--font-display)" font-size="14"
                    font-weight="600" fill="var(--fig-ink)">Rice husk ash (RHA)</text>
              <text x="678" y="76" font-family="var(--font-body)" font-size="11"
                    font-weight="650" fill="var(--fig-2)">62.3 % SiO<tspan font-size="8" dy="3">2</tspan></text>
              <text x="678" y="93" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">Specific gravity 2.2</text>
              <text x="678" y="107" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">Bulk density 105.9 kg/m&#179;</text>
            </g>

            <g stroke="var(--fig-stroke)" stroke-width="1.5" marker-end="url(#arrowRha)">
              <path d="M204 74 H222"/><path d="M422 74 H440"/><path d="M640 74 H658"/>
            </g>

            <path d="M8 140 H912" stroke="var(--fig-grid)" stroke-width="1"/>

            <text x="8" y="166" font-family="var(--font-body)" font-size="10"
                  font-weight="600" letter-spacing="0.1em"
                  fill="var(--fig-ink-soft)">B   EXPERIMENTAL PROGRAMME</text>

            <g>
              <rect x="8" y="178" width="196" height="94" rx="8"
                    fill="var(--fig-panel)" stroke="var(--fig-stroke)" stroke-width="1.3"/>
              <text x="24" y="202" font-family="var(--font-display)" font-size="13.5"
                    font-weight="600" fill="var(--fig-ink)">Mix design</text>
              <text x="24" y="224" font-family="var(--font-body)" font-size="11.5"
                    font-weight="650" fill="var(--fig-1)">1 : 1.5 : 3</text>
              <text x="24" y="240" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">cement : sand : stone</text>
              <text x="24" y="258" font-family="var(--font-body)" font-size="11.5"
                    font-weight="650" fill="var(--fig-1)">W/C = 0.45</text>

              <rect x="226" y="178" width="196" height="94" rx="8"
                    fill="var(--fig-panel)" stroke="var(--fig-stroke)" stroke-width="1.3"/>
              <text x="242" y="202" font-family="var(--font-display)" font-size="13.5"
                    font-weight="600" fill="var(--fig-ink)">Replacement levels</text>
              <text x="242" y="226" font-family="var(--font-body)" font-size="11.5"
                    font-weight="650" fill="var(--fig-3)">0, 5, 10, 15, 20, 25 %</text>
              <text x="242" y="244" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">RHA substituted for cement</text>
              <text x="242" y="258" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">by weight; all else constant.</text>

              <rect x="444" y="178" width="196" height="94" rx="8"
                    fill="var(--fig-panel)" stroke="var(--fig-stroke)" stroke-width="1.3"/>
              <text x="460" y="202" font-family="var(--font-display)" font-size="13.5"
                    font-weight="600" fill="var(--fig-ink)">Casting &amp; curing</text>
              <text x="460" y="224" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">Cylinders filled in 3 layers,</text>
              <text x="460" y="238" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">25 tamps per layer.</text>
              <text x="460" y="252" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">Demoulded at 24 h, then</text>
              <text x="460" y="266" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">water-cured.</text>

              <rect x="662" y="178" width="250" height="94" rx="8"
                    fill="var(--fig-1)" opacity="0.08"/>
              <rect x="662" y="178" width="250" height="94" rx="8" fill="none"
                    stroke="var(--fig-1)" stroke-width="1.7"/>
              <text x="678" y="202" font-family="var(--font-display)" font-size="13.5"
                    font-weight="600" fill="var(--fig-ink)">Compression testing</text>
              <text x="678" y="226" font-family="var(--font-body)" font-size="11.5"
                    font-weight="650" fill="var(--fig-1)">7, 14 and 28 days</text>
              <text x="678" y="244" font-family="var(--font-body)" font-size="10.5"
                    fill="var(--fig-ink-soft)">3 specimens per mix per age</text>
              <text x="678" y="260" font-family="var(--font-body)" font-size="11"
                    font-weight="650" fill="var(--fig-1)">54 specimens in total</text>
            </g>

            <g stroke="var(--fig-stroke)" stroke-width="1.5" marker-end="url(#arrowRha)">
              <path d="M204 224 H222"/><path d="M422 224 H440"/><path d="M640 224 H658"/>
            </g>
          </svg>