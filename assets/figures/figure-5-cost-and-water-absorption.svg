  <style>
    /*  Standalone copy of a figure from mdhasibulhossain263-hk.github.io/hasain-academic-website
        Colours are defined here so the file works on its own in any
        viewer, and in Word, PowerPoint, Illustrator or Inkscape.       */
    :root {
      --font-display: Georgia, "Times New Roman", serif;
      --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: Menlo, Consolas, monospace;
      --fig-bg: #ffffff;
      --fig-panel: #f5f3ef;
      --fig-stroke: #b9b2a6;
      --fig-ink: #1b2a3a;
      --fig-ink-soft: #5c6b7a;
      --fig-1: #16365c;
      --fig-2: #1f7a6a;
      --fig-3: #b4802a;
      --fig-4: #9b4a2f;
      --fig-5: #5a6b86;
      --fig-grid: #e6e2da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fig-bg: #131f2b; --fig-panel: #192835; --fig-stroke: #46596b;
        --fig-ink: #dde6ee; --fig-ink-soft: #9aaab8;
        --fig-1: #7fb0e8; --fig-2: #4fc0aa; --fig-3: #e0a94f;
        --fig-4: #e08a6a; --fig-5: #93a6bd; --fig-grid: #24333f;
      }
    }
    svg { background: var(--fig-bg); }
  </style>

            <title id="fig5-title">Material cost and water absorption against replacement level</title>
            <desc id="fig5-desc">Two panels. The left panel shows material cost per
              cylinder falling steadily from 21.85 taka at 0 per cent replacement to
              20.48 taka at 25 per cent. The right panel shows water absorption
              rising from 2.63 per cent to 4.32 per cent over the same range, which
              is a durability penalty.</desc>

            <text x="90" y="28" font-family="var(--font-body)" font-size="10"
                  font-weight="600" letter-spacing="0.1em" fill="var(--fig-ink-soft)">A</text>
            <text x="110" y="28" font-family="var(--font-body)" font-size="11.5"
                  font-weight="600" fill="var(--fig-ink)">Material cost per cylinder (tk) — falls</text>

            <g stroke="var(--fig-grid)" stroke-width="1"><path d="M90 250.0 H430 M90 205.0 H430 M90 160.0 H430 M90 115.0 H430 M90 70.0 H430"/></g>
