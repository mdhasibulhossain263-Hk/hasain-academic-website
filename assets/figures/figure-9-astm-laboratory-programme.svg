          </g>

          <!-- converge -->
          <g fill="none" stroke="var(--fig-stroke)" stroke-width="1.3">
            <path d="M109 276 V294 H460"/>
            <path d="M343 276 V294"/>
            <path d="M577 276 V294"/>
            <path d="M811 276 V294 H460"/>
            <path d="M460 294 V312" marker-end="url(#arrowLab)"/>
          </g>

          <!-- outputs -->
          <rect x="120" y="316" width="680" height="76" rx="8"
                fill="var(--fig-2)" opacity="0.08"/>
          <rect x="120" y="316" width="680" height="76" rx="8" fill="none"
                stroke="var(--fig-2)" stroke-width="1.5"/>
          <text x="460" y="340" text-anchor="middle" font-family="var(--font-body)"
                font-size="9.5" font-weight="650" letter-spacing="0.09em"
                fill="var(--fig-2)">PARAMETERS FEED FORWARD INTO</text>
          <text x="460" y="363" text-anchor="middle" font-family="var(--font-display)"
                font-size="14.5" font-weight="600" fill="var(--fig-ink)">PLAXIS 3D finite element models  ·  concrete mix design</text>
          <text x="460" y="382" text-anchor="middle" font-family="var(--font-body)"
                font-size="10.5" fill="var(--fig-ink-soft)">Measured properties, not assumed values, as model input</text>
        </svg>