<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 372" role="img"
               aria-labelledby="fig6-title fig6-desc" xmlns="http://www.w3.org/2000/svg">
  <style>
    /*  Standalone copy of a figure from mdhasibulhossain263-hk.github.io/hasain-academic-website
        Colours are defined here so the file works on its own in any
        viewer, and in Word, PowerPoint, Illustrator or Inkscape.       */
    :root {
      --font-display: Georgia, "Times New Roman", serif;
      --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: Menlo, Consolas, monospace;
      --fig-bg: #ffffff;
      --fig-panel: #f5f3ef;
      --fig-stroke: #b9b2a6;
      --fig-ink: #1b2a3a;
      --fig-ink-soft: #5c6b7a;
      --fig-1: #16365c;
      --fig-2: #1f7a6a;
      --fig-3: #b4802a;
      --fig-4: #9b4a2f;
      --fig-5: #5a6b86;
      --fig-grid: #e6e2da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fig-bg: #131f2b; --fig-panel: #192835; --fig-stroke: #46596b;
        --fig-ink: #dde6ee; --fig-ink-soft: #9aaab8;
        --fig-1: #7fb0e8; --fig-2: #4fc0aa; --fig-3: #e0a94f;
        --fig-4: #e08a6a; --fig-5: #93a6bd; --fig-grid: #24333f;
      }
    }
    svg { background: var(--fig-bg); }
  </style>

            <title id="fig6-title">The three failure mechanisms of a granular pile</title>
            <desc id="fig6-desc">Three schematic cross-sections. In bulging
              failure a long pile expands laterally near the top where confinement
              is weakest. In general shear failure a short pile and the soil
              beneath it fail together along a continuous slip surface. In
              punching failure a short pile drives downward into soft soil without
              mobilising a full failure surface. Which mechanism governs depends on
              the length-to-diameter ratio and the soil profile.</desc>

            <defs>
              <pattern id="aggPat6" width="11" height="11" patternUnits="userSpaceOnUse">
                <circle cx="3" cy="3" r="2.1" fill="var(--fig-3)" opacity="0.75"/>
                <circle cx="8.5" cy="8" r="1.6" fill="var(--fig-4)" opacity="0.65"/>
              </pattern>
              <pattern id="softPat6" width="9" height="9" patternUnits="userSpaceOnUse">
                <path d="M0 9 L9 0" stroke="var(--fig-5)" stroke-width="0.7" opacity="0.4"/>
              </pattern>
              <pattern id="firmPat6" width="12" height="12" patternUnits="userSpaceOnUse">
                <path d="M0 12 L12 0 M-3 3 L3 -3 M9 15 L15 9" stroke="var(--fig-5)"
                      stroke-width="1.1" opacity="0.6"/>
              </pattern>
              <marker id="arrL6" viewBox="0 0 10 10" refX="8.5" refY="5"
                      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M0 1 L9 5 L0 9 z" fill="var(--fig-4)"/>
              </marker>
              <marker id="arrT6" viewBox="0 0 10 10" refX="8.5" refY="5"
                      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M0 1.5 L9 5 L0 8.5 z" fill="var(--fig-2)"/>
              </marker>
            </defs>

            <!-- ===================== PANEL A : BULGING ===================== -->
            <text x="20" y="22" font-family="var(--font-body)" font-size="10"
                  font-weight="600" letter-spacing="0.1em" fill="var(--fig-ink-soft)">A</text>
            <text x="38" y="22" font-family="var(--font-display)" font-size="14"
                  font-weight="600" fill="var(--fig-ink)">Bulging</text>

            <rect x="20" y="62" width="256" height="216" fill="url(#softPat6)"/>
            <rect x="20" y="62" width="256" height="216" fill="var(--fig-5)" opacity="0.07"/>
            <rect x="20" y="62" width="256" height="216" fill="none"
                  stroke="var(--fig-stroke)" stroke-width="1.2"/>
            <path d="M20 62 H276" stroke="var(--fig-ink)" stroke-width="1.8"/>
            <rect x="118" y="46" width="60" height="16" rx="2" fill="var(--fig-1)" opacity="0.9"/>

            <!-- bulged column: straight, swelling, straight -->
            <path d="M126 62
                     C126 96, 110 104, 110 124
                     C110 146, 126 152, 126 178
                     L126 278 L170 278 L170 178
                     C170 152, 186 146, 186 124
                     C186 104, 170 96, 170 62 Z"
                  fill="url(#aggPat6)" stroke="var(--fig-3)" stroke-width="1.8"/>

            <!-- lateral expansion arrows at the bulge -->
            <g stroke="var(--fig-4)" stroke-width="1.6" marker-end="url(#arrL6)">
              <path d="M104 124 H86"/><path d="M192 124 H210"/>
            </g>
            <g stroke="var(--fig-4)" stroke-width="2.2" marker-end="url(#arrL6)">
              <path d="M136 22 V42"/><path d="M160 22 V42"/>
            </g>

            <text x="70" y="112" text-anchor="end" font-family="var(--font-body)"
                  font-size="9.5" fill="var(--fig-4)">lateral</text>
            <text x="70" y="124" text-anchor="end" font-family="var(--font-body)"
                  font-size="9.5" fill="var(--fig-4)">expansion</text>

            <!-- depth of bulging marker -->
            <g stroke="var(--fig-2)" stroke-width="1" stroke-dasharray="3 3">
              <path d="M20 160 H276"/>
            </g>
            <text x="268" y="153" text-anchor="end" font-family="var(--font-body)"
                  font-size="9" fill="var(--fig-2)">upper 2–3 D</text>

            <text x="30" y="300" font-family="var(--font-body)" font-size="10.5"
                  fill="var(--fig-ink-soft)">Long pile in uniformly soft soil. The column</text>
            <text x="30" y="314" font-family="var(--font-body)" font-size="10.5"
                  fill="var(--fig-ink-soft)">swells where confinement is weakest, near the</text>
            <text x="30" y="328" font-family="var(--font-body)" font-size="10.5"
                  fill="var(--fig-ink-soft)">surface. Load never reaches the pile toe.</text>
            <text x="30" y="350" font-family="var(--font-body)" font-size="10"
                  font-weight="650" fill="var(--fig-2)">Governs when L / D &gt; about 4–5</text>

            <!-- ===================== PANEL B : GENERAL SHEAR ===================== -->
            <text x="332" y="22" font-family="var(--font-body)" font-size="10"
                  font-weight="600" letter-spacing="0.1em" fill="var(--fig-ink-soft)">B</text>
            <text x="350" y="22" font-family="var(--font-display)" font-size="14"
                  font-weight="600" fill="var(--fig-ink)">General shear</text>

            <rect x="332" y="62" width="256" height="216" fill="url(#softPat6)"/>
            <rect x="332" y="62" width="256" height="216" fill="var(--fig-5)" opacity="0.07"/>
            <rect x="332" y="62" width="256" height="216" fill="none"
                  stroke="var(--fig-stroke)" stroke-width="1.2"/>
            <path d="M332 62 H588" stroke="var(--fig-ink)" stroke-width="1.8"/>
            <rect x="430" y="46" width="60" height="16" rx="2" fill="var(--fig-1)" opacity="0.9"/>

            <!-- short column -->
            <rect x="438" y="62" width="44" height="86" fill="url(#aggPat6)"
                  stroke="var(--fig-3)" stroke-width="1.8"/>

            <g stroke="var(--fig-4)" stroke-width="2.2" marker-end="url(#arrL6)">
              <path d="M448 22 V42"/><path d="M472 22 V42"/>
            </g>

            <!-- continuous slip surface through pile toe and up to the surface -->
            <path d="M372 62 C372 122, 414 158, 460 158 C506 158, 548 122, 548 62"
                  fill="var(--fig-2)" opacity="0.1"/>
            <path d="M372 62 C372 122, 414 158, 460 158 C506 158, 548 122, 548 62"
                  fill="none" stroke="var(--fig-2)" stroke-width="2"
                  stroke-dasharray="7 4"/>

            <g stroke="var(--fig-2)" stroke-width="1.4" marker-end="url(#arrT6)">
              <path d="M392 92 C388 70, 384 68, 378 64"/>
              <path d="M528 92 C532 70, 536 68, 542 64"/>
            </g>

            <text x="460" y="180" text-anchor="middle" font-family="var(--font-body)"
                  font-size="9.5" font-weight="650" fill="var(--fig-2)">continuous slip surface</text>

            <text x="342" y="300" font-family="var(--font-body)" font-size="10.5"
                  fill="var(--fig-ink-soft)">Short pile. The column and the soil beneath it</text>
            <text x="342" y="314" font-family="var(--font-body)" font-size="10.5"
                  fill="var(--fig-ink-soft)">fail together along one surface, as a shallow</text>
            <text x="342" y="328" font-family="var(--font-body)" font-size="10.5"
                  fill="var(--fig-ink-soft)">foundation would.</text>
            <text x="342" y="350" font-family="var(--font-body)" font-size="10"
                  font-weight="650" fill="var(--fig-2)">Governs when L / D is small</text>

            <!-- ===================== PANEL C : PUNCHING ===================== -->
            <text x="644" y="22" font-family="var(--font-body)" font-size="10"
                  font-weight="600" letter-spacing="0.1em" fill="var(--fig-ink-soft)">C</text>
            <text x="662" y="22" font-family="var(--font-display)" font-size="14"
                  font-weight="600" fill="var(--fig-ink)">Punching</text>

            <rect x="644" y="62" width="256" height="156" fill="url(#softPat6)"/>
            <rect x="644" y="62" width="256" height="156" fill="var(--fig-5)" opacity="0.07"/>
            <rect x="644" y="218" width="256" height="60" fill="url(#firmPat6)"/>
            <rect x="644" y="218" width="256" height="60" fill="var(--fig-5)" opacity="0.14"/>
            <rect x="644" y="62" width="256" height="216" fill="none"
                  stroke="var(--fig-stroke)" stroke-width="1.2"/>
            <path d="M644 62 H900" stroke="var(--fig-ink)" stroke-width="1.8"/>
            <path d="M644 218 H900" stroke="var(--fig-stroke)" stroke-width="1.4"/>
            <rect x="742" y="46" width="60" height="16" rx="2" fill="var(--fig-1)" opacity="0.9"/>

            <!-- column punching down: original outline dashed, displaced solid -->
            <rect x="750" y="62" width="44" height="100" fill="none"
                  stroke="var(--fig-stroke)" stroke-width="1" stroke-dasharray="4 3"/>
            <rect x="750" y="88" width="44" height="100" fill="url(#aggPat6)"
                  stroke="var(--fig-3)" stroke-width="1.8"/>

            <g stroke="var(--fig-4)" stroke-width="2.2" marker-end="url(#arrL6)">
              <path d="M760 22 V42"/><path d="M784 22 V42"/>
            </g>
            <!-- downward displacement -->
            <g stroke="var(--fig-4)" stroke-width="1.6" marker-end="url(#arrL6)">
              <path d="M772 198 V214"/>
            </g>
            <!-- soil dragged down beside the pile -->
            <g stroke="var(--fig-2)" stroke-width="1.3" marker-end="url(#arrT6)">
              <path d="M730 96 V126"/><path d="M814 96 V126"/>
            </g>

            <path d="M746 70 H716" stroke="var(--fig-stroke)" stroke-width="0.9" fill="none"/>
            <text x="712" y="68" text-anchor="end" font-family="var(--font-body)"
                  font-size="9" fill="var(--fig-ink-soft)">original</text>
            <text x="712" y="79" text-anchor="end" font-family="var(--font-body)"
                  font-size="9" fill="var(--fig-ink-soft)">position</text>
            <text x="890" y="246" text-anchor="end" font-family="var(--font-body)"
                  font-size="9.5" fill="var(--fig-ink-soft)">firm stratum</text>

            <text x="654" y="300" font-family="var(--font-body)" font-size="10.5"
                  fill="var(--fig-ink-soft)">The column drives downward into soft soil,</text>
            <text x="654" y="314" font-family="var(--font-body)" font-size="10.5"
                  fill="var(--fig-ink-soft)">dragging the surrounding ground with it, without</text>
            <text x="654" y="328" font-family="var(--font-body)" font-size="10.5"
                  fill="var(--fig-ink-soft)">forming a full failure surface.</text>
            <text x="654" y="350" font-family="var(--font-body)" font-size="10"
                  font-weight="650" fill="var(--fig-2)">Governs on a floating pile in very soft soil</text>
          </svg>