            <text x="156" y="286" text-anchor="end" font-family="var(--font-body)" font-size="11.5" font-weight="600" fill="var(--fig-ink)">MgO</text>
            <rect x="170" y="264" width="25.4" height="15" rx="2" fill="var(--fig-5)"/>
            <text x="202.4" y="276" font-family="var(--font-body)" font-size="10" fill="var(--fig-ink-soft)">2.57 %</text>
            <rect x="170" y="283" width="34.6" height="15" rx="2" fill="var(--fig-2)"/>
            <text x="211.6" y="295" font-family="var(--font-body)" font-size="10" font-weight="600" fill="var(--fig-2)">3.50 %</text>
