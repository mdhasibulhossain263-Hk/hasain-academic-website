            <rect x="170" y="316" width="26.6" height="15" rx="2" fill="var(--fig-5)"/>
            <text x="203.6" y="328" font-family="var(--font-body)" font-size="10" fill="var(--fig-ink-soft)">2.69 %</text>
            <rect x="170" y="335" width="6.0" height="15" rx="2" fill="var(--fig-2)"/>
            <text x="183.0" y="347" font-family="var(--font-body)" font-size="10" font-weight="600" fill="var(--fig-2)">0.61 %</text>
            <g>
  <text x="170.0" y="370" text-anchor="middle" font-family="var(--font-body)" font-size="9.5" fill="var(--fig-ink-soft)">0</text>
