<!-- Apply the saved appearance before first paint so the page never flashes. -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem("mhh-theme");
      if (saved === "dark" || saved === "light") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    } catch (e) { /* private window or blocked storage — use system setting */ }
  })();
</script>
